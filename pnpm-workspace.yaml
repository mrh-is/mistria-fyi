engineStrict: true

# Fail `pnpm run` & `pnpm exec` on absent or stale dependencies instead of installing them silently
# (pnpm 11 defaults to `install`). Install explicitly with `pnpm install --frozen-lockfile` or
# `node scripts/setup-worktree.ts`; commands that run before dependencies exist are invoked with
# `node` directly.
verifyDepsBeforeRun: error

packages:
  - pipeline

allowBuilds:
  esbuild: true
  workerd: true

# Wrangler's miniflare pins undici 7.29.1 exactly, which `pnpm audit` flags
# (GHSA-xjj6-f33q-929c and others, patched in 7.30.1). Drop it once the resolved
# Wrangler's miniflare pins 7.30.1 or later (Wrangler 4.153.0 does).
overrides:
  "undici@7": "^7.30.1"
  # Vitest's jsdom 30.1.0 allows undici ^8.10.2, which admits releases `pnpm audit` flags
  # (GHSA-xjj6-f33q-929c and others, patched in 8.12.2). Drop it once jsdom's own range excludes
  # the vulnerable releases.
  "undici@8": "^8.12.2"
  # ESLint, @eslint/config-array, & typescript-estree allow minimatch ^10.2, which `pnpm audit`
  # flags (GHSA-g3hv-75wg-m249, patched in 11.0.1). They call only `minimatch()`, `new Minimatch`,
  # `.match()`, & `.pattern`, which 11 keeps. Drop it once their own ranges allow 11.0.1 or later.
  "minimatch@10": "^11.0.3"

auditConfig:
  ignoreGhsas:
    # deepmerge has no patched release (4.3.1 is the last), and vite-plugin-svelte 7.3.1 still
    # depends on it. It only merges this project's own Svelte & Vite config at dev & build time,
    # so no untrusted object reaches it. https://github.com/advisories/GHSA-gcqx-w48m-w2h4
    # Drop it once vite-plugin-svelte replaces deepmerge or a patched release ships.
    - GHSA-gcqx-w48m-w2h4
