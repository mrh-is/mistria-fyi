engineStrict: true

packages:
  - pipeline

allowBuilds:
  esbuild: true
  workerd: true

# Wrangler's miniflare resolves undici 7.29.0 without this, which `pnpm audit`
# flags (GHSA-2gqq-gqf2-x968 and others, patched in 7.29.1). Drop it once
# miniflare's own range excludes the vulnerable releases.
overrides:
  "undici@7": "^7.29.1"
