engineStrict: true

# Codex cloud cannot write to its home directory; keep pnpm writes in the checkout.
storeDir: .pnpm-store
cacheDir: .pnpm-store/cache

packages:
  - pipeline

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260911.1-alpha
  - wrangler@4.131.2

overrides:
  "cookie@<0.7.0": ">=0.7.0"
  nanoid: ">=3.3.18"
  undici: ">=7.29.0"
  wrangler: ">=4.131.2"
