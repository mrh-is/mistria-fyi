engineStrict: true

# Fail `pnpm run` & `pnpm exec` on absent or stale dependencies instead of installing them silently
# (pnpm 11 defaults to `install`). Install explicitly with `pnpm install --frozen-lockfile` or
# `node scripts/setup-worktree.ts`; commands that run before dependencies exist are invoked with
# `node` directly.
verifyDepsBeforeRun: error

packages:
  - pipeline

allowBuilds:
  esbuild: true
  workerd: true

# Wrangler's miniflare pins undici 7.29.0 exactly, which `pnpm audit` flags
# (GHSA-xjj6-f33q-929c and others, patched in 7.30.1). Drop it once miniflare's
# own pin moves past 7.30.0.
overrides:
  "undici@7": "^7.30.1"
  # Vitest's jsdom allows undici ^8.10.2, so the lockfile keeps 8.11.2, which `pnpm audit` flags
  # (GHSA-xjj6-f33q-929c and others, patched in 8.12.2). Drop it once jsdom's own range excludes
  # the vulnerable releases.
  "undici@8": "^8.12.2"
  # Miniflare pins sharp 0.35.4 exactly, which Dependabot flags (patched in
  # 0.35.5). Drop it once miniflare's own pin moves past 0.35.4.
  "sharp@<0.35.5": "^0.35.5"

# `pnpm audit` gates CI. Ignore an advisory only while it's disputed or unpatched, with a link to
# the reason, and remove the entry once a fix or withdrawal lands.
auditConfig:
  ignoreGhsas:
    # braces: disputed, no patched release (https://github.com/micromatch/braces/issues/70).
    - GHSA-vfj7-8cjw-p6xm
