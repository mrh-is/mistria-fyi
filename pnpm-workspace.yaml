engineStrict: true

# Fail `pnpm run` & `pnpm exec` on absent or stale dependencies instead of installing them silently
# (pnpm 11 defaults to `install`). Install explicitly with `pnpm install --frozen-lockfile` or
# `node scripts/setup-worktree.ts`; commands that run before dependencies exist are invoked with
# `node` directly.
verifyDepsBeforeRun: error

packages:
  - pipeline

allowBuilds:
  esbuild: true
  workerd: true

# Wrangler's miniflare pins undici 7.29.1 exactly, which `pnpm audit` flags
# (GHSA-xjj6-f33q-929c and others, patched in 7.30.1). Drop it once the resolved
# Wrangler's miniflare pins 7.30.1 or later (Wrangler 4.153.0 does).
overrides:
  "undici@7": "^7.30.1"
  # Vitest's jsdom allows undici ^8.12.1, which admits a release `pnpm audit` flags
  # (GHSA-xjj6-f33q-929c and others, patched in 8.12.2). Drop it once jsdom's own range excludes
  # the vulnerable releases.
  "undici@8": "^8.12.2"
