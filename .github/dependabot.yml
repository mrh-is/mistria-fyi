version: 2
updates:
  # Routine upgrades are batched manually. A zero limit disables version-update PRs while
  # retaining security-update PRs (repository security updates must remain enabled).
  - package-ecosystem: npm
    directories:
      - /
      - /scripts/locale-fonts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
