name: Guarded paths

# Generated files change only in PRs that say so: `generated-data` for
# src/lib/data/tracker-data.json (AGENTS.md, architecture boundaries), plus `pnpm run data:diff`
# output in the PR body. scripts/check-guarded-paths.ts holds the rules, including renames out of
# a guarded path.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# Every metadata event must finish: a shared concurrency group can cancel pending required checks.

jobs:
  guarded-paths:
    name: Guarded paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Read the live PR, not the event snapshot, so a rerun sees current labels & body.
          PR=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          PR_BODY=$(jq -r '.body // ""' <<< "$PR")
          PR_LABELS=$(jq -c '[.labels[].name]' <<< "$PR")
          export PR_BODY PR_LABELS
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[]' | jq -s . > "$RUNNER_TEMP/files.json"
          node scripts/check-guarded-paths.ts "$RUNNER_TEMP/files.json"
