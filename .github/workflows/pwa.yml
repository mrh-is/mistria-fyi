name: PWA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    name: Chromium PWA behavior
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run PWA suite
        id: pwa-tests
        continue-on-error: true
        run: pnpm run test:pwa

      - name: Upload PWA failure report
        if: steps.pwa-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pwa-report
          path: |
            .playwright-pwa-report/
            .playwright-pwa-results/
          retention-days: 14

      - name: Preserve test outcome
        if: steps.pwa-tests.outcome == 'failure'
        run: exit 1
