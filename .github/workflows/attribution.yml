name: Attribution

# Agent attribution rules from docs/agent-workflow.md; scripts/check-attribution.ts documents them. Only the
# PR's own commits are checked, so existing history never fails.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# Every metadata event must finish: a shared concurrency group can cancel pending required checks.

jobs:
  attribution:
    name: Attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Read the live PR, not the event snapshot, so a rerun of any event's run sees current
          # labels & body.
          PR=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          PR_BODY=$(jq -r '.body // ""' <<< "$PR")
          PR_COMMIT_COUNT=$(jq -r '.commits' <<< "$PR")
          PR_LABELS=$(jq -c '[.labels[].name]' <<< "$PR")
          # Cloudflare Pages builds same-repository branches only, so forks get no preview URL.
          PR_HEAD_REF=$(jq -r 'if .head.repo.full_name == .base.repo.full_name then .head.ref else "" end' <<< "$PR")
          export PR_BODY PR_COMMIT_COUNT PR_HEAD_REF PR_LABELS
          PR_COMMITS=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {message: .commit.message, parents: (.parents | length), sha: .sha}')
          export PR_COMMITS
          node scripts/check-attribution.ts
