name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect test-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      cleanup: ${{ steps.filter.outputs.cleanup }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pull requests run the browser suites only when the app, its tests, or their tooling change;
      # main pushes, nightly runs, and manual dispatches always run them.
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          browser=true
          cleanup=false
          files=
          if [ "$EVENT_NAME" = "pull_request" ]; then
            browser=false
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
          elif [ "$EVENT_NAME" = "push" ]; then
            if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              files=$(git ls-tree -r --name-only HEAD)
            else
              if ! git cat-file -e "$BASE_SHA^{commit}"; then
                gh auth setup-git
                git fetch --no-tags --depth=1 origin "$BASE_SHA"
              fi
              files=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
            fi
          fi
          while IFS= read -r file; do
            case "$file" in
              scripts/cleanup-merged-worktrees.ts) cleanup=true ;;
            esac
            case "$file" in
              src/* | static/* | tests/* | messages/* | project.inlang/* | _headers | \
                scripts/playwright-* | playwright*.config.ts | svelte.config.* | vite.config.* | \
                package.json | pnpm-lock.yaml | .node-version | .github/workflows/ci.yml)
                browser=true
                ;;
            esac
          done <<< "$files"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - run: pnpm run lint

  # Fails on moderate or worse advisories in the lockfile. Nightly runs catch advisories published
  # after a merge. Accepted exceptions live in pnpm-workspace.yaml's auditConfig.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - run: pnpm audit --audit-level=moderate

  check:
    name: Check types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:i18n

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # Vitest's fsModuleCache is content-addressed, so a stale restore only costs cache misses.
      # Keying on the commit saves a fresh copy each run; the restore keys pick up the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vitest-${{ runner.os }}-
      # Every push runs the complete asset-independent suite; coverage is collected nightly.
      - name: Test with timing budgets
        env:
          VITEST_COVERAGE: ${{ github.event_name == 'schedule' }}
          VITEST_CLEANUP_CHANGED: ${{ needs.changes.outputs.cleanup }}
        run: node scripts/vitest-timings.ts
      - name: Publish Vitest timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-timings
          include-hidden-files: true
          path: .vitest-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Summarize coverage
        if: github.event_name == 'schedule'
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:routes
      - name: Check built SEO & locale byte budgets
        run: pnpm run check:built
      # The browser suites serve this output instead of rebuilding it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
          retention-days: 1

  accessibility:
    name: Accessibility (${{ matrix.shard }})
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The preview config reads Git metadata; root in the container must trust this checkout.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
      # Geometry measures Satoshi's production metrics (#708). The script pins the font's SHA-256,
      # so its hash keys the cache; a warm cache never touches the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/browser/fixtures/local/satoshi-regular.woff2
          key: satoshi-${{ hashFiles('scripts/playwright-satoshi.ts') }}
      - name: Fetch & verify Satoshi
        run: pnpm exec tsx scripts/playwright-satoshi.ts
      - id: accessibility-tests
        continue-on-error: true
        run: |
          pnpm exec tsx scripts/playwright-allocation.ts ${{ matrix.shard }}
          pnpm run test:accessibility --test-list=.playwright-artifacts/test-list.txt
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
      - if: >-
          steps.accessibility-tests.outcome == 'failure' ||
          hashFiles('.playwright-results/**/trace.zip') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .playwright-artifacts/
            .playwright-report/
            .playwright-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish accessibility timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-timings-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .playwright-artifacts/results.json
            .playwright-artifacts/allocation.json
            .playwright-artifacts/test-list.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve test outcome
        if: steps.accessibility-tests.outcome == 'failure'
        run: exit 1

  pwa:
    name: PWA
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The preview config reads Git metadata; root in the container must trust this checkout.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
      - id: pwa-tests
        continue-on-error: true
        run: pnpm run test:pwa
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
      - if: >-
          steps.pwa-tests.outcome == 'failure' || hashFiles('.playwright-pwa-results/**/trace.zip')
          != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-report
          include-hidden-files: true
          path: |
            .playwright-pwa-report/
            .playwright-pwa-results/
            .playwright-artifacts/preview-*.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve test outcome
        if: steps.pwa-tests.outcome == 'failure'
        run: exit 1

  issue-sync:
    name: Synchronize scheduled accessibility issue
    if: always() && github.event_name == 'schedule'
    needs: accessibility
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - if: needs.accessibility.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: accessibility-report-*
          path: playwright-shard-reports
      - env:
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm run accessibility:monitor

  # One stable check to require in branch protection, whatever the job list or shard count. A
  # skipped browser job (no relevant changes) passes; a failed or cancelled job does not.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, audit, check, test, build, accessibility, pwa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
