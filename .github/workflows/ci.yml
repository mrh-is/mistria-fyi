name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main & the schedule share a ref, so the event keeps a merge from cancelling the nightly
# jobs, & the schedule from cancelling a push's timing sample.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# pnpm/setup restores the pnpm store, which also holds the devEngines Node runtime, so a warm cache
# never downloads Node from nodejs.org. Host jobs restore the store the build job saves. The cache
# archive's paths are relative to the workspace, which containers mount at /__w, so container jobs
# keep their own store on that mount (where pnpm can hard link from it), saved by the PWA job.
# pnpm/setup v3.1.2 retries pnpm downloads after 30 seconds without data. The step timeout still
# bounds exhausted retries, cold caches, & runtime downloads.
jobs:
  changes:
    name: Detect test-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      cleanup: ${{ steps.filter.outputs.cleanup }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      messages: ${{ steps.filter.outputs.messages }}
      relay: ${{ steps.filter.outputs.relay }}
      scripts: ${{ steps.filter.outputs.scripts }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pull requests run the browser suites only when the app, its tests, or their tooling change,
      # and the relay & scripts tests only when their own inputs or a shared input change. Main
      # pushes, nightly runs, and manual dispatches always run all three.
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          browser=true
          cleanup=false
          dependencies=false
          messages=false
          relay=true
          scripts=true
          tests=
          files=
          if [ "$EVENT_NAME" = "pull_request" ]; then
            browser=false
            relay=false
            scripts=false
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
          elif [ "$EVENT_NAME" = "push" ]; then
            if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              files=$(git ls-tree -r --name-only HEAD)
            else
              if ! git cat-file -e "$BASE_SHA^{commit}"; then
                gh auth setup-git
                git fetch --no-tags --depth=1 origin "$BASE_SHA"
              fi
              files=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
            fi
          fi
          while IFS= read -r file; do
            case "$file" in
              scripts/cleanup-merged-worktrees.ts) cleanup=true ;;
            esac
            case "$file" in
              package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .github/workflows/ci.yml) dependencies=true ;;
            esac
            case "$file" in
              messages/* | scripts/check-locale-sync.* | scripts/locale-sync-allowlist.json) messages=true ;;
            esac
            case "$file" in
              *.test.ts) tests="$tests $file" ;;
            esac
            # Shared inputs change every test's environment, so they run everything.
            case "$file" in
              package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .node-version | vite.config.* | \
                tsconfig* | .github/workflows/ci.yml)
                relay=true
                scripts=true
                ;;
            esac
            # The Vitest config loads the relay test's sequencer & worker environment from scripts/.
            case "$file" in
              relay/* | scripts/vitest-relay-sequencer.ts | scripts/vitest-*-env.ts) relay=true ;;
            esac
            # Pipeline code imports from scripts/. The policy tests read the workflows, hooks, agent
            # settings, & Playwright configs, and the stylelint test imports its config.
            case "$file" in
              scripts/* | pipeline/* | .github/workflows/* | .husky/* | .claude/settings.json | \
                .codex/hooks.json | playwright*.config.ts | stylelint.config.*)
                scripts=true
                ;;
            esac
            case "$file" in
              src/* | static/* | tests/* | messages/* | project.inlang/* | _headers | \
                scripts/playwright-* | playwright*.config.ts | svelte.config.* | vite.config.* | \
                package.json | pnpm-lock.yaml | .node-version | .github/workflows/ci.yml)
                browser=true
                ;;
            esac
          done <<< "$files"
          # The stale-translation check compares a pull request with its base; other events skip it.
          [ "$EVENT_NAME" = "pull_request" ] || messages=false
          # Only a pull request can fail on a slow test file it changes; other events just warn.
          [ "$EVENT_NAME" = "pull_request" ] || tests=
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "messages=$messages" >> "$GITHUB_OUTPUT"
          echo "relay=$relay" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "tests=${tests# }" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - run: pnpm run verify -- --step=lint

  # A pull request that changes an English message must change each locale's value too (or allowlist
  # the key). The checkout is the PR's merge commit, so HEAD^1 is the base branch tip it merges into.
  locale-sync:
    name: Locale sync
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.messages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify -- --step=check:locale-sync --base HEAD^1

  # PRs & main pushes fail on moderate or worse advisories only when dependency inputs or this
  # workflow change. Manual dispatches always audit; the nightly report tracks new advisories
  # without failing on findings. Accepted exceptions live in pnpm-workspace.yaml's auditConfig.
  audit:
    name: Audit dependencies
    needs: changes
    if: needs.changes.outputs.dependencies == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The store holds nothing this job runs except Node, which pnpm/setup installs from it.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      # This job installs nothing, so it starts the step runner with `node` instead of `pnpm run`,
      # which refuses to run until dependencies are installed.
      - run: node scripts/verify.ts --step=audit

  check:
    name: Check types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify -- --step=check
      - run: pnpm run verify -- --step=check:i18n
      # Run even when an earlier check failed, so one push reports every failing check.
      - if: ${{ !cancelled() }}
        run: pnpm run verify -- --step=knip

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    # The only bound on a hung suite: timing limits never kill a run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      # Vitest's fsModuleCache is content-addressed, so a stale restore only costs cache misses.
      # Keying on the commit saves a fresh copy each run; the restore keys pick up the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vitest-${{ runner.os }}-
      # Every push runs the complete asset-independent suite; coverage is collected nightly.
      - name: Test with timing budgets
        env:
          VITEST_COVERAGE: ${{ github.event_name == 'schedule' }}
          VITEST_CLEANUP_CHANGED: ${{ needs.changes.outputs.cleanup }}
          VITEST_RELAY_CHANGED: ${{ needs.changes.outputs.relay }}
          VITEST_SCRIPTS_CHANGED: ${{ needs.changes.outputs.scripts }}
          VITEST_TOUCHED_TEST_FILES: ${{ needs.changes.outputs.tests }}
        run: pnpm run verify -- --step=test:budgets
      - name: Publish Vitest timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-timings
          include-hidden-files: true
          path: .vitest-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Summarize coverage
        if: github.event_name == 'schedule'
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          # Only the build job saves the host store, and only from main; every other host job restores it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify -- --step=build
      - run: pnpm run verify -- --step=check:routes
      - name: Check built SEO & locale byte budgets
        run: pnpm run verify -- --step=check:built
      # The browser suites serve this output instead of rebuilding it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
          retention-days: 1

  accessibility:
    name: Accessibility (${{ matrix.shard }})
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      pnpm_config_store_dir: /__w/.pnpm-store
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The preview config reads Git metadata; root in the container must trust this checkout.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
      # Geometry measures Satoshi's production metrics (#708). The script pins the font's SHA-256,
      # so its hash keys the cache; a warm cache never touches the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/browser/fixtures/local/satoshi-regular.woff2
          key: satoshi-${{ hashFiles('scripts/playwright-satoshi.ts') }}
      - name: Fetch & verify Satoshi
        run: pnpm exec tsx scripts/playwright-satoshi.ts
      - id: accessibility-tests
        continue-on-error: true
        run: |
          pnpm exec tsx scripts/playwright-allocation.ts ${{ matrix.shard }}
          pnpm run verify -- --step=test:accessibility --test-list=.playwright-artifacts/test-list.txt
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
      - if: >-
          steps.accessibility-tests.outcome == 'failure' ||
          hashFiles('.playwright-results/**/trace.zip') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .playwright-artifacts/
            .playwright-report/
            .playwright-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish accessibility timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-timings-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .playwright-artifacts/results.json
            .playwright-artifacts/allocation.json
            .playwright-artifacts/test-list.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve test outcome
        if: steps.accessibility-tests.outcome == 'failure'
        run: exit 1

  pwa:
    name: PWA
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      pnpm_config_store_dir: /__w/.pnpm-store
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The preview config reads Git metadata; root in the container must trust this checkout.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          # Only this job saves the container store, and only from main; accessibility restores it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
      - id: pwa-tests
        continue-on-error: true
        run: pnpm run verify -- --step=test:pwa
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
      - if: >-
          steps.pwa-tests.outcome == 'failure' || hashFiles('.playwright-pwa-results/**/trace.zip')
          != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-report
          include-hidden-files: true
          path: |
            .playwright-pwa-report/
            .playwright-pwa-results/
            .playwright-artifacts/preview-*.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve test outcome
        if: steps.pwa-tests.outcome == 'failure'
        run: exit 1

  issue-sync:
    name: Synchronize scheduled accessibility issue
    if: always() && github.event_name == 'schedule'
    needs: accessibility
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - if: needs.accessibility.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: accessibility-report-*
          path: playwright-shard-reports
      - env:
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm run accessibility:monitor

  # Timing trends & dependency advisories stay in one issue. It reads main's recent timing
  # artifacts, so this runs on its own instead of waiting for tonight's test job.
  nightly-report:
    name: Report nightly findings
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 3
        with:
          cache: true
          save-cache: false
          install: false
      - env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/nightly-report.ts

  # One stable check to require in branch protection, whatever the job list or shard count. A
  # skipped browser job (no relevant changes) passes; a failed or cancelled job does not.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, locale-sync, audit, check, test, build, accessibility, pwa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
