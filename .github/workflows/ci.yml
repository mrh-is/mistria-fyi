name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      # Pull requests run the browser suites only when the app, its tests, or their tooling change;
      # main pushes, nightly runs, and manual dispatches always run them.
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          browser=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            browser=false
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            while IFS= read -r file; do
              case "$file" in
                src/* | static/* | tests/* | scripts/playwright-* | playwright*.config.ts | \
                  svelte.config.* | vite.config.* | tailwind.* | package.json | pnpm-lock.yaml | \
                  .github/workflows/ci.yml)
                  browser=true
                  ;;
              esac
            done <<< "$files"
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - run: pnpm run lint

  check:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:i18n

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      # Vitest's fsModuleCache is content-addressed, so a stale restore only costs cache misses.
      # Keying on the commit saves a fresh copy each run; the restore keys pick up the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vitest-${{ runner.os }}-
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:routes
      # The browser suites serve this output instead of rebuilding it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
          retention-days: 1

  accessibility:
    name: Accessibility (${{ matrix.shard }})
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
      - id: accessibility-tests
        continue-on-error: true
        run: pnpm run test:accessibility -- --shard=${{ matrix.shard }}
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
      - if: steps.accessibility-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report-${{ strategy.job-index }}
          path: |
            .playwright-artifacts/
            .playwright-report/
            .playwright-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve test outcome
        if: steps.accessibility-tests.outcome == 'failure'
        run: exit 1

  pwa:
    name: PWA
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/output/
      - id: pwa-tests
        continue-on-error: true
        run: pnpm run test:pwa
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
      - if: steps.pwa-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-report
          path: |
            .playwright-pwa-report/
            .playwright-pwa-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve test outcome
        if: steps.pwa-tests.outcome == 'failure'
        run: exit 1

  issue-sync:
    name: Synchronize scheduled accessibility issue
    if: always() && github.event_name == 'schedule'
    needs: accessibility
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
          runtime: node@26
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - if: needs.accessibility.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: accessibility-report-*
          path: playwright-shard-reports
      - env:
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm run accessibility:monitor

  # One stable check to require in branch protection, whatever the job list or shard count. A
  # skipped browser job (no relevant changes) passes; a failed or cancelled job does not.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, check, test, build, accessibility, pwa]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
