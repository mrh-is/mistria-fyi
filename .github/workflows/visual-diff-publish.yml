name: Publish visual diffs

on:
  workflow_run:
    workflows: [Visual-diff pilot]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-visual-diff-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write # GitHub’s attachment upload requires push access.
      pull-requests: write
    steps:
      # Always execute trusted default-branch code. Never install PR dependencies here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: visual-diff-report
          path: ${{ runner.temp }}/visual-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_ARTIFACT_DIRECTORY: ${{ runner.temp }}/visual-artifact
          VISUAL_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/publish-visual-diff.ts
