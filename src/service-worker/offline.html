<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mistria Field Guide — Offline</title>
    <!-- offlinePagePlugin (src/lib/build/offline-page.ts) fills this slot from src/app.css &
         src/app.html: the app's fonts, light & dark tokens, and saved-theme bootstrap. -->
    <!-- %offline.app-theme% -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-body);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2rem;
        background: var(--background);
        color: var(--foreground);
        -webkit-tap-highlight-color: transparent;
      }
      .container {
        text-align: center;
        max-width: 20rem;
      }
      h1 {
        font-family: var(--font-display);
        font-style: var(--font-display-style);
        font-size: 1.875rem;
        font-weight: 400;
        line-height: 1.2;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.5;
        color: var(--muted-foreground);
        margin-bottom: 1.5rem;
      }
      .retry {
        display: inline-flex;
        align-items: center;
        height: 2.75rem;
        padding: 0 1.5rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        font-size: 1rem;
        text-decoration: none;
      }
      .retry:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .retry:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline</h1>
      <p>
        The Mistria Field Guide needs an internet connection to load for the first time. Your
        tracked progress is saved locally and will be here when you reconnect.
      </p>
      <!-- A link, not a script: the CSP blocks inline handlers. An empty href reloads this URL. -->
      <a class="retry" href="">Try again</a>
    </div>
  </body>
</html>
