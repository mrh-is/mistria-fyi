<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent FOUC: apply dark class before first paint
      (function () {
        var t = localStorage.getItem("harvest-helper-theme") || "system";
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Harvest" />
    <script>
      // Sync theme-color with dark mode
      if (document.documentElement.classList.contains("dark"))
        document.querySelector('meta[name="theme-color"]').content = "#011011";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <title>Harvest Helper</title>
    <meta name="description" content="Track your Fields of Mistria 100% completion progress" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
