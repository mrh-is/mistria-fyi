<!doctype html>
<html lang="%lang%" dir="%dir%">
  <head>
    <script nonce="%sveltekit.nonce%">
      // Prevent FOUC: apply dark class before first paint
      (function () {
        var t;
        try {
          t = localStorage.getItem("mistria-fyi:theme");
        } catch (e) {
          t = null;
        }
        t = t || "system";
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Field Guide" />
    <script nonce="%sveltekit.nonce%">
      // Sync theme-color with dark mode
      if (document.documentElement.classList.contains("dark"))
        document.querySelector('meta[name="theme-color"]').content = "#222226";
    </script>
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
