<!doctype html>
<html lang="en">
  <head>
    <script nonce="%sveltekit.nonce%">
      // Prevent FOUC: apply dark class before first paint
      (function () {
        var t;
        try {
          t = localStorage.getItem("mistria-fyi-theme");
        } catch (e) {
          t = null;
        }
        t = t || "system";
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Field Guide" />
    <script nonce="%sveltekit.nonce%">
      // Sync theme-color with dark mode
      if (document.documentElement.classList.contains("dark"))
        document.querySelector('meta[name="theme-color"]').content = "#011011";
    </script>
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="canonical" href="https://mistria.fyi" />
    <title>Mistria Field Guide</title>
    <meta name="description" content="Track your Fields of Mistria 100% completion progress" />
    <meta property="og:title" content="Mistria Field Guide" />
    <meta
      property="og:description"
      content="Track your Fields of Mistria 100% completion progress"
    />
    <meta property="og:url" content="https://mistria.fyi" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mistria Field Guide" />
    <meta
      name="twitter:description"
      content="Track your Fields of Mistria 100% completion progress"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
