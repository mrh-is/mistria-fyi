<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent FOUC: apply dark class before first paint
      (function () {
        var t = localStorage.getItem("harvest-helper-theme") || "system";
        var dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Sync theme-color with dark mode
      if (document.documentElement.classList.contains("dark"))
        document.querySelector('meta[name="theme-color"]').content = "#1a1a2e";
    </script>
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="description" content="Track your Fields of Mistria 100% completion progress" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
