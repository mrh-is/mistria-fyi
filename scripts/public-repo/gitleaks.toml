# Keep the default detectors; these are verified public IDs, not credentials.
# Each exception requires BOTH the exact identifier & its exact historical source file.
title = "Public candidate scan"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "French item IDs adjacent to translated key-related text"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/lib/data/locales/fr/items\.json$''']
regexes = [
  '''^(mist_cushion_v1|cavern_mossy_rug_v2|butterfly_painting_v2|butterfly_painting_v3)$''',
]

[[rules.allowlists]]
description = "Spanish animal IDs containing capybara’s API-like substring"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/lib/data/locales/es/animals\.json$''']
regexes = ['''^(capybara/cosmetics/(bow|horns|leaf|yuzu)|chicken/variants/white)$''']

[[rules.allowlists]]
description = "French animal IDs adjacent to translated key-related text"
condition = "AND"
regexTarget = "secret"
paths = ['''^src/lib/data/locales/fr/animals\.json$''']
regexes = ['''^rabbit/cosmetics/(halo|horn)$''']

[[rules.allowlists]]
description = "Literal localStorage quarantine key in persistence tests"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^src/lib/stores/persistence-lifecycle\.isolated\.client\.test\.ts$''',
  '''^src/lib/stores/persistence-lifecycle\.client\.test\.ts$''',
]
regexes = ['''^mistria-fyi-v1-quarantine$''']
